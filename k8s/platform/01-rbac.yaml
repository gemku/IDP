apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api-sa
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: internal-developer-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-api-role
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: internal-developer-platform
rules:
  # KRO Custom Resources
  - apiGroups: ["kro.run"]
    resources: ["gitlabtagtriggers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kubernetes Metrics API for build pod gauges
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Core Pods & Log tailing for live SSE build log streaming
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Namespace inspection
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-api-rolebinding
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: internal-developer-platform
subjects:
  - kind: ServiceAccount
    name: platform-api-sa
    namespace: platform-system
roleRef:
  kind: ClusterRole
  name: platform-api-role
  apiGroup: rbac.authorization.k8s.io
