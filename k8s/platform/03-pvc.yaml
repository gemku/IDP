apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-db-pvc
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: internal-developer-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
