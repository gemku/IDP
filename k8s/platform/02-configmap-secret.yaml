apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: internal-developer-platform
data:
  PORT: "3000"
  DATABASE_PATH: "/app/data/platform.db"
  GITLAB_URL: "http://gitlab-webservice-default.gitlab.svc.cluster.local:8181"
  GITLAB_REDIRECT_URI: "https://platform.example.com/api/auth/gitlab/callback"
  LDAP_URL: "ldap://openldap.default.svc.cluster.local:389"
  LDAP_BASE_DN: "dc=example,dc=com"
  KRO_NAMESPACE: "kro-system"
  ARGO_GATEWAY_URL: "http://gitlab-eventsource-svc.argo-events.svc.cluster.local:12000"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: internal-developer-platform
type: Opaque
stringData:
  SESSION_SECRET: "k8s-in-cluster-session-secret-change-in-prod"
  GITLAB_CLIENT_ID: "gitlab-application-id-placeholder"
  GITLAB_CLIENT_SECRET: "gitlab-application-secret-placeholder"
  GITLAB_ADMIN_TOKEN: "gitlab-admin-pat-placeholder"
  LDAP_BIND_DN: "cn=admin,dc=example,dc=com"
  LDAP_BIND_PASSWORD: "ldap-admin-password-placeholder"
