apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-frontend
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-frontend
    app.kubernetes.io/part-of: internal-developer-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-frontend
        app.kubernetes.io/part-of: internal-developer-platform
    spec:
      containers:
        - name: platform-frontend
          image: platform-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
