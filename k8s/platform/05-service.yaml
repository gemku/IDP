apiVersion: v1
kind: Service
metadata:
  name: platform-backend-svc
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-backend
    app.kubernetes.io/part-of: internal-developer-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: platform-frontend-svc
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-frontend
    app.kubernetes.io/part-of: internal-developer-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api-svc
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-backend
    app.kubernetes.io/part-of: internal-developer-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
